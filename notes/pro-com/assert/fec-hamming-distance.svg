<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">重复三次码的汉明距离</title>
  <desc id="desc">合法码字 000 和 111 相距三次比特翻转。接收 001 时只需一次翻转回到 000，却要两次翻转才到 111。</desc>
  <rect width="900" height="280" rx="16" fill="#f7fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18384a">为什么一个错误可以被纠正？</text>
  <path d="M145 145H755" stroke="#678298" stroke-width="4"/>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="145" cy="145" r="42" fill="#087e76"/><text x="145" y="153" font-size="24" font-weight="700" fill="#fff">000</text>
    <circle cx="348" cy="145" r="42" fill="#e4a43b"/><text x="348" y="153" font-size="24" font-weight="700" fill="#263747">001</text>
    <circle cx="552" cy="145" r="42" fill="#dbe7ef"/><text x="552" y="153" font-size="24" font-weight="700" fill="#263747">011</text>
    <circle cx="755" cy="145" r="42" fill="#087e76"/><text x="755" y="153" font-size="24" font-weight="700" fill="#fff">111</text>
    <text x="145" y="222" font-size="17" fill="#18384a">合法码字</text>
    <text x="348" y="222" font-size="17" fill="#18384a">接收值</text>
    <text x="755" y="222" font-size="17" fill="#18384a">合法码字</text>
    <text x="246" y="91" font-size="15" fill="#476274">翻转 1 位</text>
    <text x="450" y="91" font-size="15" fill="#476274">翻转 1 位</text>
    <text x="654" y="91" font-size="15" fill="#476274">翻转 1 位</text>
  </g>
  <text x="450" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#476274">仅展示一条比特翻转路径；两个合法码字的汉明距离为 3</text>
</svg>
