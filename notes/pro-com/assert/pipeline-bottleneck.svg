<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">DVB-S2 接收流水线的最慢阶段决定端到端吞吐</title>
  <desc id="desc">教学假设中，解映射、反交织、LDPC、BCH 分别可持续处理每秒 30、24、18、40 千帧，因此整链不能超过每秒 18 千帧。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59758a"/></marker></defs>
  <rect width="1040" height="300" rx="16" fill="#f7fafc"/>
  <text x="520" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18384a">流水线吞吐取决于最慢的持续处理阶段</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#18384a">
    <rect x="50" y="105" width="190" height="100" rx="12" fill="#dfeef4" stroke="#7896a7" stroke-width="2"/>
    <rect x="300" y="105" width="190" height="100" rx="12" fill="#dfeef4" stroke="#7896a7" stroke-width="2"/>
    <rect x="550" y="105" width="190" height="100" rx="12" fill="#fce8d8" stroke="#c68055" stroke-width="3"/>
    <rect x="800" y="105" width="190" height="100" rx="12" fill="#dfeef4" stroke="#7896a7" stroke-width="2"/>
    <g font-size="20" font-weight="700"><text x="145" y="144">Demapper</text><text x="395" y="144">Deinterleaver</text><text x="645" y="144">LDPC</text><text x="895" y="144">BCH</text></g>
    <g font-size="18"><text x="145" y="179">30 kframe/s</text><text x="395" y="179">24 kframe/s</text><text x="645" y="179">18 kframe/s</text><text x="895" y="179">40 kframe/s</text></g>
  </g>
  <g stroke="#59758a" stroke-width="3" marker-end="url(#arrow)"><path d="M243 155H294"/><path d="M493 155H544"/><path d="M743 155H794"/></g>
  <text x="520" y="251" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#b05e38">端到端上界：18 kframe/s（还可能受共享带宽与背压限制）</text>
  <text x="520" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#476274">纯教学假设，非目标器件的测量结果；所有阶段统一为帧/秒口径</text>
</svg>
