<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">五个变量节点与两个校验节点构成的 Tanner 图</title>
  <desc id="desc">C1 连接 v1、v2、v3，C2 连接 v3、v4、v5；共享的变量 v3 把两条奇偶校验联系起来。</desc>
  <rect width="900" height="340" rx="16" fill="#f7fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#18384a">矩阵中一个 1，就是图中的一条边</text>
  <g stroke="#7a93a5" stroke-width="3" fill="none">
    <path d="M315 129L125 233M315 129L270 233M315 129L450 233"/>
    <path d="M585 129L450 233M585 129L630 233M585 129L775 233"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="20" font-weight="700">
    <rect x="272" y="91" width="86" height="68" rx="12" fill="#236a92"/>
    <rect x="542" y="91" width="86" height="68" rx="12" fill="#236a92"/>
    <text x="315" y="133" fill="#fff">C1</text><text x="585" y="133" fill="#fff">C2</text>
    <g fill="#087e76"><circle cx="125" cy="250" r="33"/><circle cx="270" cy="250" r="33"/><circle cx="450" cy="250" r="33"/><circle cx="630" cy="250" r="33"/><circle cx="775" cy="250" r="33"/></g>
    <g fill="#fff"><text x="125" y="257">v1</text><text x="270" y="257">v2</text><text x="450" y="257">v3</text><text x="630" y="257">v4</text><text x="775" y="257">v5</text></g>
  </g>
  <text x="450" y="320" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#476274">C1: v1 ⊕ v2 ⊕ v3 = 0　　C2: v3 ⊕ v4 ⊕ v5 = 0</text>
</svg>
