<text x="490" y="303" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="normal" fill="#203044">按行读出： (x0,x4,x8)  (x1,x5,x9)  (x2,x6,x10)  (x3,x7,x11)</text>
<text x="450" y="344" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="normal" fill="#526273">反交织：每 3 个 LLR 填一行，再按列恢复 x0 … x11 的顺序。</text>
