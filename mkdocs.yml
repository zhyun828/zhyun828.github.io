site_name: ZY Engineering Notes
site_url: https://zhyun828.github.io/
site_description: Notes on embedded systems, robotics, C++, FPGA, and interview preparation.

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: 深色模式
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/white-balance-sunny
        name: 浅色模式
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/home.css
  - stylesheets/page-search.css?v=2

extra_javascript:
  - javascripts/page-search.js?v=3
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - material/search:
      pipeline: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Notes:
      - Overview: notes/index.md
      - 通信协议:
          - Overview: notes/protocols/index.md
          - USART: notes/protocols/usart.md
          - I2C: notes/protocols/i2c.md
          - SPI: notes/protocols/spi.md
          - CAN: notes/protocols/can.md
          - TCP / UDP / IP: notes/protocols/tcp-udp-ip.md
          - Modbus: notes/protocols/modbus.md
          - Ethernet: notes/protocols/ethernet.md
          - LIN: notes/protocols/lin.md
          - HTTP / HTTPS: notes/protocols/http-https.md
      - 专业通信:
          - DVB-S2:
              - 通信系统: notes/pro-com/dvb-s2/Communication-System.md
              - 解映射与交织: notes/pro-com/dvb-s2/Demapper-and-Interleaver.md
          - 前向纠错:
              - FEC 基础: notes/pro-com/fec/Forward-Error-Correction.md
              - BCH: notes/pro-com/fec/BCH.md
              - LDPC: notes/pro-com/fec/LDPC.md
          - Versal AI Engine: notes/pro-com/versal/Versal-AIE.md
          - 高吞吐架构: notes/pro-com/acceleration/High-Throughput-Architecture.md
      - 面试:
          - 快速检索表: notes/面试/快速检索表.md
          - 嵌入式面试汇总表: notes/面试/嵌入式面试汇总表.md
          - 高频题深度解析: notes/面试/高频题深度解析.md
          - 项目经历问答面试: notes/面试/项目经历问答面试.md
      - Arduino:
          - basics: notes/Arduino/basics.md
          - projet:
              - projet: notes/Arduino/projet/projet.md
              - pre: notes/Arduino/projet/pre.md
              - code: notes/Arduino/projet/code.md
              - thoughts: notes/Arduino/projet/thoughts.md
      - Cpp:
          - basics: notes/Cpp/basics.md
          - code: notes/Cpp/code.md
          - CMake 与 CMakeLists.txt: notes/Cpp/cmake教程.md
          - UML:
              - 系统学习教材: notes/Cpp/UML/UML.md
              - 分类与图解速查: notes/Cpp/UML/UML-Cheatsheet.md
          - 设计模式详解: notes/Cpp/design_pattern/Design-Patterns.md
          - 设计模式速查: notes/Cpp/design_pattern/Design-Patterns-Cheatsheet.md
      - embedded_system:
          - basic: notes/embedded_system/basic.md
          - TP:
              - README: notes/embedded_system/TP/README.md
      - FPGA:
          - basics: notes/FPGA/basics.md
          - Zynq 硬件乘法加速器: notes/FPGA/zynq-hardware-acceleration-intro.md
      - gazebo:
          - basic: notes/ros/gazebo/basic.md
      - linux:
          - basic: notes/linux/basic.md
          - linux驱动:
              - 下载资料: notes/linux/linux驱动/00_下载资料.md
              - 搭建开发环境: notes/linux/linux驱动/01_搭建开发环境.md
              - 通用的驱动框架: notes/linux/linux驱动/02_通用的驱动框架.md
              - 使用模板操作硬件: notes/linux/linux驱动/03_使用模板操作硬件.md
              - 平台总线设备模型和设备树: notes/linux/linux驱动/04_平台总线设备模型和设备树.md
              - I2C驱动程序模板: notes/linux/linux驱动/05_I2C驱动程序模板.md
      - LVGL:
          - basic: notes/LVGL/basic.md
      - ros:
          - basic: notes/ros/basic.md
          - code: notes/ros/code.md
      - stm32:
          - stm32_knowledge_notes: notes/stm32/stm32_knowledge_notes.md
          - RTOS / FreeRTOS 知识整理: notes/stm32/rtos_freertos_notes_compact.md
          - 外设: notes/stm32/外设.md
          - 寄存器: notes/stm32/寄存器.md
